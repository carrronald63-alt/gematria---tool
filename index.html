<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amber's Word Journal</title>

<style>
:root{
  --bg:#020506;
  --panel:rgba(0,0,0,0.62);
  --line:rgba(0,255,150,0.18);
  --soft:rgba(255,255,255,0.05);
  --soft2:rgba(255,255,255,0.035);
  --green:#00ff9c;
  --text:#ecfff5;
  --muted:#9cc7af;
  --total-bg:rgba(0,255,150,0.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

#matrix{
  position:fixed;
  inset:0;
  z-index:0;
}

.app{
  position:relative;
  z-index:2;
  max-width:920px;
  margin:20px auto;
  padding:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  backdrop-filter:blur(2px);
}

h1{
  margin:0;
  text-align:center;
  color:var(--green);
  font-size:clamp(26px,4vw,36px);
  line-height:1.1;
  display: flex;
  justify-content: center;
  align-items: center;
}

h1 span {
  margin-left: 10px;
  font-size: 1.2em;
  color: #ecfff5;
  font-weight: bold;
}

.sub{
  margin:8px 0 14px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

input{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid rgba(0,255,150,0.28);
  background:#000;
  color:#fff;
  outline:none;
  font-size:16px;
}

input::placeholder{
  color:#8bb7a0;
}

button{
  padding:12px 16px;
  border-radius:10px;
  border:1px solid rgba(0,255,150,0.30);
  background:rgba(0,255,150,0.10);
  color:var(--green);
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

.results{
  display:none;
  margin-top:14px;
}

.results.show{
  display:block;
}

.row{
  margin-bottom:8px;
  padding:8px;
  border-radius:12px;
  background:var(--soft2);
  border:1px solid rgba(255,255,255,0.03);
}

.row-inner{
  display:grid;
  grid-template-columns:96px 1fr 64px;
  align-items:center;
  gap:8px;
}

.name{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  height:40px;
  padding:0 8px;
  border-radius:8px;
  background:rgba(0,255,150,0.10);
  color:var(--green);
  font-size:12px;
  font-weight:700;
  letter-spacing:0.2px;
  overflow:hidden;
  white-space:nowrap;
}

.seq-wrap{
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
}

.seq{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:48px;
  gap:6px;
  width:max-content;
}

.box,
.total{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  font-size:15px;
  font-variant-numeric:tabular-nums;
  line-height:1;
}

.box{
  background:var(--soft);
  color:var(--text);
}

.total{
  background:var(--total-bg);
  color:#dffff0;
  font-weight:700;
  justify-self:end;
  margin-left:4px;
}

.matrix-box{
  display:none;
  margin-top:14px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(0,0,0,0.22);
}

.matrix-box.show{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}

.card{
  text-align:center;
  padding:10px 8px;
  border-radius:10px;
  background:var(--soft);
  min-width:0;
}

.card-name{
  display:block;
  color:#d6fff0;
  font-size:13px;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-total{
  display:block;
  color:var(--green);
  font-size:18px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

@media (max-width:700px){
  .app{
    margin:10px;
    padding:14px;
  }

  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  button{
    width:100%;
  }

  .row-inner{
    grid-template-columns:78px 1fr 58px;
    gap:6px;
  }

  .name{
    font-size:11px;
    padding:0 6px;
  }

  .seq{
    grid-auto-columns:42px;
    gap:5px;
  }

  .box,
  .total{
    height:36px;
    font-size:14px;
  }

  .total{
    width:58px;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .card-name{
    font-size:12px;
  }

  .card-total{
    font-size:16px;
  }
}

/* Butterfly effect */
.butterfly-icon {
  font-size: 2em;
  color: var(--green);
  display: inline-block;
  animation: pulse 1.5s infinite;
  margin-left: 10px;
}

@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }
  50% {
    transform: scale(1.2);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 0.8;
  }
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="app">
  <h1>Amber's Word Journal
    <span class="butterfly-icon">🦋</span>
  </h1>
  <p class="sub">Type a word and tap Generate</p>

  <div class="controls">
    <input id="word" type="text" placeholder="Enter word" />
    <button onclick="run()">Generate</button>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
// Your original script goes here (same as before)
</script>
</body>
</html>
